# DaVinci Resolve dialogs can misbehave when Hyprland handles XWayland modal focus/events.
windowrule {
    name = davinci-resolve-dialogs
    match:class = .*[Rr]esolve.*
    match:xwayland = true
    match:modal = true

    float = true
    center = true
    suppress_event = maximize fullscreen
}
